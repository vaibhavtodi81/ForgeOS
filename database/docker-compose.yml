services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeos_db}
      POSTGRES_USER: ${POSTGRES_USER:-forgeos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeos_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-forgeos_user} -d $${POSTGRES_DB:-forgeos_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
