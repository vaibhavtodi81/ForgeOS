version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgeos_db
      POSTGRES_USER: forgeos_user
      POSTGRES_PASSWORD: forgeos_secure_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Entrypoint scripts are executed alphabetically on initial database creation
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seeds/0001_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgeos_user -d forgeos_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
